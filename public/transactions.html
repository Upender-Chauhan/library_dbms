<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Circulation — Bibliotheca</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div id="ledger-bar" class="ledger-bar"></div>
  <div class="app-shell" id="shell"></div>

  <div class="modal-overlay" id="issue-modal">
    <div class="modal">
      <div class="modal-head">
        <h3>Issue a Book</h3>
        <button class="modal-close" onclick="closeModal('issue-modal')">&times;</button>
      </div>
      <form id="issue-form">
        <div class="modal-body">
          <div class="form-grid">
            <div class="field full">
              <label>Book</label>
              <select id="f-book" required></select>
            </div>
            <div class="field full">
              <label>Member</label>
              <select id="f-member" required></select>
            </div>
            <div class="field">
              <label>Issue Date</label>
              <input type="date" id="f-issue-date" required>
            </div>
            <div class="field">
              <label>Loan Period (days)</label>
              <input type="number" id="f-period" value="14" min="1" max="60" required>
            </div>
          </div>
        </div>
        <div class="modal-foot">
          <button type="button" class="btn ghost" onclick="closeModal('issue-modal')">Cancel</button>
          <button type="submit" class="btn burgundy">Confirm Issue</button>
        </div>
      </form>
    </div>
  </div>

<script src="assets/app.js"></script>
<script>
startPage('transactions', load);

let loans = [];
let statusFilter = 'All';

async function load(){
  loans = await api('GET', '/api/loans');
  render();
}

function render(){
  const filtered = statusFilter === 'All' ? loans : loans.filter(l => l.status === statusFilter);

  document.getElementById('main-content').innerHTML = `
    <div class="page-head">
      <div>
        <div class="eyebrow">Circulation Desk</div>
        <h1>Issue &amp; Return</h1>
        <p class="desc">Track every title moving in and out of the reading room.</p>
      </div>
      <button class="btn burgundy" onclick="openIssueModal()">+ Issue a Book</button>
    </div>

    <div class="panel">
      <div class="panel-body">
        <div class="search-row">
          <select id="status-select">
            ${['All','Issued','Overdue','Returned'].map(s => `<option value="${s}" ${s===statusFilter?'selected':''}>${s}</option>`).join('')}
          </select>
          <span class="muted small right">${filtered.length} record(s)</span>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-body" style="padding-top:8px;">
        ${filtered.length ? `
        <table class="ledger">
          <thead>
            <tr><th>Book</th><th>Member</th><th>Issued</th><th>Due</th><th>Returned</th><th>Status</th><th></th></tr>
          </thead>
          <tbody>
            ${filtered.map(l => `
              <tr>
                <td><strong>${esc(l.bookTitle)}</strong></td>
                <td>${esc(l.memberName)}</td>
                <td class="mono small">${fmtDate(l.issueDate)}</td>
                <td class="mono small">${fmtDate(l.dueDate)}</td>
                <td class="mono small">${l.returnDate ? fmtDate(l.returnDate) : '—'}</td>
                <td>
                  <span class="badge ${l.status.toLowerCase()}">${l.status}</span>
                  ${l.daysLate ? `<div class="small" style="color:var(--burgundy); margin-top:3px;">${l.daysLate} day(s) late</div>` : ''}
                </td>
                <td>
                  ${l.status !== 'Returned' ? `<button class="btn ghost sm" onclick="returnBook(${l.id})">Mark Returned</button>` : ''}
                </td>
              </tr>`).join('')}
          </tbody>
        </table>
        ` : `<div class="empty-state"><div class="glyph">🔖</div><div>No records for this filter.</div></div>`}
      </div>
    </div>
  `;

  document.getElementById('status-select').addEventListener('change', e => {
    statusFilter = e.target.value; render();
  });
}

async function openIssueModal(){
  try{
    const [allBooks, allMembers] = await Promise.all([api('GET', '/api/books'), api('GET', '/api/members')]);
    const books = allBooks.filter(b => b.available > 0);
    const members = allMembers.filter(m => m.status === 'Active');

    if(!books.length){ toast('No copies currently available to issue.'); return; }
    if(!members.length){ toast('No active members eligible to borrow.'); return; }

    document.getElementById('f-book').innerHTML =
      books.map(b => `<option value="${b.id}">${esc(b.title)} (${b.available} available)</option>`).join('');
    document.getElementById('f-member').innerHTML =
      members.map(m => `<option value="${m.id}">${esc(m.name)} (${m.onLoan} on loan)</option>`).join('');
    document.getElementById('f-issue-date').value = todayISO();
    document.getElementById('f-period').value = 14;
    openModal('issue-modal');
  }catch(e){ toast(e.message); }
}

document.getElementById('issue-form').addEventListener('submit', async function(e){
  e.preventDefault();
  try{
    await api('POST', '/api/loans', {
      bookId: document.getElementById('f-book').value,
      memberId: document.getElementById('f-member').value,
      issueDate: document.getElementById('f-issue-date').value,
      period: document.getElementById('f-period').value
    });
    toast('Book issued successfully.');
    closeModal('issue-modal');
    await load();
  }catch(err){ toast(err.message); }
});

async function returnBook(loanId){
  try{
    await api('POST', '/api/loans/' + loanId + '/return');
    toast('Book marked as returned.');
    await load();
  }catch(e){ toast(e.message); }
}
</script>
</body>
</html>
