<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bibliotheca — Library Management System</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="stamp">B</div>
      <h1>Bibliotheca</h1>
      <div class="tag">Library Management System</div>

      <form id="login-form">
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="admin" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
        </div>
        <div class="err-msg" id="err"></div>
        <button type="submit" class="btn burgundy">Sign in to the Reading Room</button>
      </form>

      <div class="login-hint">
        Demo credentials — username <b>admin</b>, password <b>admin123</b><br>
        Data is stored in a SQLite database on the server (<b>library.db</b>).
      </div>
    </div>
  </div>

<script src="assets/app.js"></script>
<script>
  // already signed in? skip straight to the dashboard
  api('GET', '/api/session').then(() => { window.location.href = 'dashboard.html'; }).catch(() => {});

  document.getElementById('login-form').addEventListener('submit', async function(e){
    e.preventDefault();
    const errEl = document.getElementById('err');
    errEl.textContent = '';
    try{
      await api('POST', '/api/login', {
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value
      });
      window.location.href = 'dashboard.html';
    }catch(err){
      errEl.textContent = err.message;
    }
  });
</script>
</body>
</html>
